<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FretCoach</title>
  <meta name="description" content="Learn guitar by playing: finger positions for every chord, and a coach that listens through your microphone.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4C18 4 8 14 10 30c2 14 14 28 22 30 8-2 20-16 22-30C56 14 46 4 32 4z' fill='%23f0a43a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="#home" aria-label="FretCoach home">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4C18 4 8 14 10 30c2 14 14 28 22 30 8-2 20-16 22-30C56 14 46 4 32 4z" class="pick"/><path d="M22 22h20M22 30h20M22 38h20" class="pick-lines"/></svg>
        <span>FretCoach</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Home</span></a>
        <a href="#learn" data-nav="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-5a3 3 0 0 0-3 3"/></svg><span>Learn</span></a>
        <a href="#songs" data-nav="songs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm11-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg><span>Songs</span></a>
        <a href="#chords" data-nav="chords"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18M10 3v18M14 3v18M18 3v18M4 7h16"/><circle cx="10" cy="11" r="1.6"/><circle cx="14" cy="15" r="1.6"/></svg><span>Chords</span></a>
        <a href="#tuner" data-nav="tuner"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16a8 8 0 0 1 16 0M12 16l4-6"/></svg><span>Tuner</span></a>
        <a href="#drills" data-nav="drills"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span>Drills</span></a>
        <a href="#settings" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a>
      </nav>
      <button class="mic-pill" id="micPill" data-state="off" aria-pressed="false" title="Turn the microphone on or off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg>
        <span class="lbl">Mic off</span>
        <span class="meter" aria-hidden="true"><i></i></span>
      </button>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/music.js"></script>
  <script src="js/detect.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/core.js"></script>
  <script src="js/player.js"></script>
  <script src="js/views.js"></script>
</body>
</html>
